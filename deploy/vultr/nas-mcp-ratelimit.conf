# NAS MCP gate: throttle password logins and client registrations per IP (other paths unlimited).
map "$request_method:$uri" $nasmcp_auth_limit_key {
    "POST:/.auth/login"   $binary_remote_addr;
    "POST:/.idp/register" $binary_remote_addr;
    default               "";
}
limit_req_zone $nasmcp_auth_limit_key zone=nasmcp_auth:10m rate=10r/m;
